name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches version.properties
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(grep -E '^VERSION_NAME=' gradle/version.properties | cut -d= -f2)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag v$tag does not match VERSION_NAME=$file in gradle/version.properties"
            exit 1
          fi

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          [ -f app/build/outputs/mapping/release/mapping.txt ] && \
            cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${GITHUB_REF_NAME}.txt" || true
          ( cd dist && sha256sum * > SHA256SUMS.txt )

      - name: Extract release notes
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v ver="$tag" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found=1 }; next }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "See CHANGELOG.md for details." > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: "Kimon ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: dist/*
