[package]
name = "sleep_core"
version = "0.1.0"
edition = "2021"
authors = ["Zenzeros Kimon"]
description = "Ultra-low-power, high-accuracy actigraphy and sleep analysis engine"

[lib]
name = "sleep_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
